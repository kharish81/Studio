<template>
    <lightning-card>
        <div>
        <lightning-record-edit-form record-id={recordId} object-api-name="Student__c" onsuccess={handleSuccess}>
            <lightning-input-field field-name="Name"></lightning-input-field>
            <lightning-input-field field-name="Year__c"></lightning-input-field>
            <lightning-input-field field-name="Branch__c"></lightning-input-field>
            <lightning-button label="Save" variant="brand" type="submit" class="slds-m-top_medium"></lightning-button>
            <lightning-button label="Cancel" variant="neutral" onclick={handleCancel} class="slds-m-top_medium"></lightning-button>
        </lightning-record-edit-form>
        </div>
    </lightning-card>
</template>
