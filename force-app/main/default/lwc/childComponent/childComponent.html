<template>
    <lightning-card title="User Information" icon-name="standard:contact">
        <div class="slds-p-horizontal_medium">
            <lightning-input
                label="Name"
                name="name"
                value={formData.name}
                onchange={handleChange}>
            </lightning-input>

            <lightning-input
                label="Email"
                name="email"
                value={formData.email}
                onchange={handleChange}>
            </lightning-input>

            <div class="slds-m-top_medium slds-align_absolute-center">
                <lightning-button
                    variant="brand"
                    label="Submit"
                    onclick={handleSubmit}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
